<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour mon amour - Kaka Nini ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0a192f 0%, #172a45 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      color: #e6f1ff;
    }

    .card-container {
      background: #112240;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(251, 191, 36, 0.2);
      width: 100%;
      max-width: 800px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    @media (min-width: 650px) {
      .card-container {
        flex-direction: row;
        align-items: center;
        padding: 35px;
      }
    }

    .message-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: left;
    }

    .title {
      color: #fbbf24;
      font-size: 22px;
      font-weight: 600;
    }

    .message-text {
      color: #ccd6f6;
      font-size: 16px;
      line-height: 1.7;
    }

    .tree-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      width: 100%;
      height: 320px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="message-section">
      <div class="title">Pour l'amour de ma vie ❤️</div>
      
      <p class="message-text">
        Joyeux anniversaire à mon homme exceptionnel, mon Kaka Nini ! 🥳🎉<br><br>
        Merci d'exister et de me rendre si heureuse chaque jour. Que cette nouvelle année t'apporte de la réussite, de la joie et tout le bonheur du monde. Je t'aime fort ! 💕
      </p>
    </div>

    <div class="tree-section">
      <canvas id="treeCanvas"></canvas>
    </div>
  </div>

  <script>
    // --- ANIMATION ARBRE DE CŒURS SUR CANVAS ---
    const canvas = document.getElementById('treeCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();

    const hearts = [];
    const fallingHearts = [];

    // Dessiner un cœur
    function drawHeart(ctx, x, y, size, color, angle = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
      ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
      ctx.fill();
      ctx.restore();
    }

    // Génération du feuillage en forme de grand cœur
    function generateHeartTree() {
      const colors = ['#fbbf24', '#f59e0b', '#d97706', '#64ffda', '#38bdf8', '#ef4444'];
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 - 20;

      for (let i = 0; i < 350; i++) {
        const t = Math.random() * Math.PI * 2;
        // Équation de forme de cœur
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        // Variation aléatoire
        const scale = 6 + Math.random() * 2;
        x = centerX + x * scale + (Math.random() - 0.5) * 35;
        y = centerY + y * scale + (Math.random() - 0.5) * 35;

        hearts.push({
          x: x,
          y: y,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          angle: (Math.random() - 0.5) * 0.5
        });
      }
    }

    // Cœurs qui s'envolent/tombent
    function spawnFallingHeart() {
      if (hearts.length === 0) return;
      const source = hearts[Math.floor(Math.random() * hearts.length)];
      fallingHearts.push({
        x: source.x,
        y: source.y,
        size: source.size,
        color: source.color,
        vx: (Math.random() - 0.7) * 1.5,
        vy: Math.random() * 1.2 + 0.5,
        opacity: 1
      });
    }

    generateHeartTree();

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2 - 20;

      // Tronc de l'arbre
      ctx.fillStyle = '#854d0e';
      ctx.beginPath();
      ctx.moveTo(centerX - 10, canvas.height - 20);
      ctx.lineTo(centerX + 10, canvas.height - 20);
      ctx.lineTo(centerX + 6, centerY + 40);
      ctx.lineTo(centerX - 6, centerY + 40);
      ctx.fill();

      // Sol
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX - 90, canvas.height - 20);
      ctx.lineTo(centerX + 90, canvas.height - 20);
      ctx.stroke();

      // Dessin du feuillage en cœurs
      hearts.forEach(h => {
        drawHeart(ctx, h.x, h.y, h.size, h.color, h.angle);
      });

      // Animation des cœurs qui tombent
      if (Math.random() < 0.3) spawnFallingHeart();

      for (let i = fallingHearts.length - 1; i >= 0; i--) {
        const fh = fallingHearts[i];
        fh.x += fh.vx;
        fh.y += fh.vy;
        fh.opacity -= 0.005;

        ctx.globalAlpha = Math.max(0, fh.opacity);
        drawHeart(ctx, fh.x, fh.y, fh.size, fh.color);
        ctx.globalAlpha = 1;

        if (fh.opacity <= 0 || fh.y > canvas.height) {
          fallingHearts.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('resize', () => {
      resizeCanvas();
      hearts.length = 0;
      generateHeartTree();
    });
  </script>
</body>
</html>
